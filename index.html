<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e17"><title>GymOS · Training Tracker</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f6f7ff;background:#0b0e17}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}main{max-width:550px;margin:auto;padding:26px 17px 110px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#9399ae}.tiny{font-size:12px}.eyebrow{font-size:11px;letter-spacing:2px;color:#9ba4ff;font-weight:800}h1{font-size:30px;margin:7px 0}h2{font-size:22px;margin:5px 0}h3{margin:0 0 8px;font-size:16px}.card{background:#151a27;border:1px solid #282e40;border-radius:19px;padding:17px;margin:13px 0}.hero{background:linear-gradient(135deg,#282f66,#171b2d 68%);padding:23px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:17px}.stat{padding:13px 8px;border-radius:14px;background:#1b2130;text-align:center}.stat strong{display:block;font-size:21px}.stat span{font-size:11px;color:#a2a8b9}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:20px 0}.day{border:1px solid #30374b;background:#171c2a;color:#9da5ba;border-radius:13px;padding:12px 0;font-weight:700}.day.active{background:#6467f5;color:white;border-color:#888aff}.exercise{padding:16px;margin:10px 0}.exercisehead{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{background:#242b40;color:#aeb8ff;padding:5px 9px;border-radius:9px;font-size:11px;white-space:nowrap}.setrow{display:grid;grid-template-columns:22px 1fr 1fr 36px;gap:8px;align-items:center;margin-top:11px}.setrow input{width:100%;min-width:0;background:#0f1420;border:1px solid #333b51;color:white;border-radius:10px;padding:10px 7px;text-align:center;font-size:14px}.setrow input:focus{outline:1px solid #787bff}.check{width:32px;height:35px;border:1px solid #555d78;background:#20273a;border-radius:9px;color:#b7bfd2}.check.done{background:#34bd91;color:#071b16;border-color:#34bd91}.progress{height:8px;background:#303648;border-radius:10px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#7779ff;transition:width .2s}.btn{border:0;border-radius:12px;padding:13px 17px;background:#696cf5;color:white;font-weight:750}.btn.secondary{background:#252d42;color:#e2e6ff}.btn.small{padding:8px 12px;font-size:12px}.full{width:100%}.nav{position:fixed;bottom:0;left:0;right:0;background:#111624;border-top:1px solid #30384a;display:flex;justify-content:center;padding:8px 8px calc(9px + env(safe-area-inset-bottom));z-index:3}.navinner{width:min(550px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{background:none;color:#8d95aa;border:0;padding:8px 0;font-size:11px}.nav button b{display:block;font-size:20px;margin-bottom:4px}.nav button.active{color:#9698ff}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.field{background:#0e1320;color:white;border:1px solid #343d54;border-radius:11px;padding:12px;min-width:0;width:100%}.fieldrow{display:flex;gap:9px;margin:12px 0}.fieldrow>*{flex:1;min-width:0}.log{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #30364a}.log:last-child{border-bottom:0}.del{background:none;border:0;color:#a5acc1;font-size:19px}.bar{height:8px;background:#2c3547;border-radius:20px;overflow:hidden;margin:14px 0}.bar>div{height:100%;background:#22c79b}.hidden{display:none}.note{font-size:12px;line-height:1.6;color:#a1a9bd}.chart{width:100%;height:180px}.pill{border-radius:10px;background:#222942;padding:8px 11px;color:#c9ceff;font-size:12px}.empty{text-align:center;color:#9ba3b7;padding:30px 10px}input[type=date]{color-scheme:dark}input[type=number]{appearance:textfield}button:active{opacity:.75}
</style></head><body><main><header class="top"><div><div class="eyebrow">YOUR PERSONAL TRAINING HUB</div><h1>GYM<span style="color:#8b8dff">OS</span></h1></div><span class="pill" id="dateLabel"></span></header><section id="view"></section></main><nav class="nav"><div class="navinner"><button data-tab="train" class="active"><b>⌁</b>Train</button><button data-tab="protein"><b>◈</b>Protein</button><button data-tab="weight"><b>↗</b>Weight</button><button data-tab="stats"><b>▥</b>Progress</button></div></nav><script>
const plan=[{name:'Push A',focus:'Chest · Shoulders · Triceps',ex:[['Dumbbell bench press',3,9],['Chest press',3,9],['Shoulder press',3,9],['Incline-bench lateral raises',3,9],['Rope triceps pushdown',3,9],['Overhead rope extension',2,9]]},{name:'Pull A',focus:'Back · Biceps · Forearms',ex:[['Wide-grip lat pulldown',3,9],['Low row',3,9],['Rear delt machine',3,9],['Incline dumbbell curls',3,9],['Reverse curls',2,11],['Wrist flexions',2,8]]},{name:'Legs A',focus:'Quad emphasis',ex:[['Leg extension',3,9],['Goblet squat',3,12],['Leg press',3,10],['Prone leg curl',3,10],['Calf extension',4,'Failure']]},{name:'Push B',focus:'Chest · Shoulders · Triceps',ex:[['High-to-low cable fly',3,9],['Low-to-high cable fly',2,9],['Pec fly machine',2,9],['Incline-bench lateral raises',3,9],['Dips',3,9],['Triceps extension',2,9]]},{name:'Pull B',focus:'Back · Biceps · Forearms',ex:[['Seated row',3,9],['Lat pulldown',3,9],['Back extension',2,10],['Cable straight-bar curls',3,9],['Preacher curls',3,9],['Wrist extensions',2,8]]},{name:'Legs B',focus:'Hamstrings · Glutes · Calves',ex:[['Romanian deadlift',3,10],['Prone leg curl',3,10],['Leg press',3,10],['Hip adductor',3,10],['Calf extension',4,'Failure']]},{name:'Rest',focus:'Recovery · Mobility · Makeup workout',ex:[]}];
const today=()=>new Date().toLocaleDateString('en-CA');const safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;try{state=JSON.parse(localStorage.getItem('gymos-v1'))||{}}catch{state={}}state.workouts??={};state.meals??={};state.weights??=[];state.goal??=160;state.unit??='kg';let tab='train',day=(new Date().getDay()+6)%7,selectedDate=today();function persist(){localStorage.setItem('gymos-v1',JSON.stringify(state))}function wk(){return selectedDate+'-'+day}function entries(){return state.workouts[wk()]||{}}function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}function totalProtein(date){return (state.meals[date]||[]).reduce((a,m)=>a+Number(m.g),0)}function header(title,sub){return `<div style="margin-top:22px"><div class="eyebrow">${safe(sub)}</div><h2>${safe(title)}</h2></div>`}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('dateLabel').textContent=new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'});document.getElementById('view').innerHTML=tab==='train'?train():tab==='protein'?protein():tab==='weight'?weight():stats()}
function train(){let p=plan[day],w=entries(),total=p.ex.reduce((a,e)=>a+e[1],0),done=Object.values(w).filter(v=>v.done).length;return `${header('Your weekly split','WORKOUT PLAN')}<div class="days">${['M','T','W','T','F','S','S'].map((x,i)=>`<button class="day ${day===i?'active':''}" onclick="day=${i};render()">${x}</button>`).join('')}</div><div class="card hero"><div class="row"><div><div class="eyebrow">${['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'][day]}</div><h2>${p.name}</h2><div class="muted tiny">${p.focus}</div></div><div style="font-size:28px">${day===6?'☾':'✦'}</div></div>${total?`<div class="row" style="margin-top:22px"><span class="tiny">${done} / ${total} sets completed</span><b>${pct(done,total)}%</b></div><div class="progress"><div style="width:${pct(done,total)}%"></div></div>`:'<p class="note">Rest day. Use Sunday for recovery, or select a missed session from the week.</p>'}</div><div class="row"><span class="muted tiny">Workout date</span><input class="field" style="max-width:170px" type="date" value="${selectedDate}" onchange="selectedDate=this.value;render()"></div>${p.ex.map((e,i)=>`<article class="card exercise"><div class="exercisehead"><h3>${i+1}. ${e[0]}</h3><span class="tag">${e[1]} × ${e[2]}</span></div><div class="setrow muted tiny"><span>Set</span><span style="text-align:center">Weight (${state.unit})</span><span style="text-align:center">Reps</span><span>Done</span></div>${Array.from({length:e[1]},(_,j)=>{let id=i+'-'+j,v=w[id]||{};return `<div class="setrow"><span class="muted tiny">${j+1}</span><input aria-label="Weight set ${j+1}" type="number" inputmode="decimal" placeholder="—" value="${safe(v.kg??'')}" onchange="updateSet(${i},${j},'kg',this.value)"><input aria-label="Reps set ${j+1}" type="number" inputmode="numeric" placeholder="${e[2]==='Failure'?'Max':e[2]}" value="${safe(v.reps??'')}" onchange="updateSet(${i},${j},'reps',this.value)"><button aria-label="Mark set ${j+1} done" class="check ${v.done?'done':''}" onclick="updateSet(${i},${j},'done',${!v.done})">${v.done?'✓':'○'}</button></div>`}).join('')}</article>`).join('')}<p class="note">Aim for 1–3 reps in reserve on most sets. Add reps or load gradually as technique and recovery allow.</p>`}
function updateSet(i,j,key,value){state.workouts[wk()]??={};state.workouts[wk()][i+'-'+j]??={};state.workouts[wk()][i+'-'+j][key]=value;persist();render()}
function protein(){let meals=state.meals[selectedDate]||[],total=totalProtein(selectedDate);return `${header('Fuel your progress','DAILY NUTRITION')}<div class="card hero"><div class="eyebrow">PROTEIN INTAKE</div><h1>${total}<span class="muted" style="font-size:17px"> / ${state.goal}g</span></h1><div class="bar"><div style="width:${pct(total,state.goal)}%"></div></div><div class="row tiny"><span>${pct(total,state.goal)}% of goal</span><span>${Math.max(0,state.goal-total)}g remaining</span></div></div><div class="card"><div class="row"><b>Daily protein goal</b><input class="field" style="max-width:90px" type="number" min="1" value="${state.goal}" onchange="state.goal=Math.max(1,Number(this.value)||160);persist();render()"></div><div class="row" style="margin-top:14px"><span class="muted tiny">Log date</span><input class="field" style="max-width:170px" type="date" value="${selectedDate}" onchange="selectedDate=this.value;render()"></div></div><div class="card"><h3>Add protein</h3><div class="fieldrow"><input id="mealname" class="field" placeholder="Chicken, shake, lunch…"><input id="mealgrams" class="field" type="number" min="1" inputmode="numeric" placeholder="Grams" style="max-width:110px"></div><button class="btn full" onclick="addMeal()">+ Add entry</button><div class="fieldrow"><button class="btn secondary" onclick="quickMeal('Protein shake',38)">+ Shake · 38g</button><button class="btn secondary" onclick="quickMeal('Protein-rich meal',35)">+ Meal · 35g</button></div></div><div class="card"><h3>Logged entries</h3>${meals.length?meals.map((m,i)=>`<div class="log"><span>${safe(m.name)}</span><span><b>${m.g}g</b><button class="del" aria-label="Delete meal" onclick="deleteMeal(${i})">×</button></span></div>`).join(''):'<div class="empty">Nothing logged yet today.</div>'}</div><p class="note">Shakes and meals are quick-add shortcuts, not automatically counted. A useful muscle-building target is about 1.6–2.2g protein per kg of body weight daily.</p>`}
function quickMeal(name,g){state.meals[selectedDate]??=[];state.meals[selectedDate].push({name,g});persist();render()}function addMeal(){let n=document.getElementById('mealname').value.trim(),g=Number(document.getElementById('mealgrams').value);if(!n||!(g>0))return alert('Enter a food and its protein amount.');quickMeal(n,g)}function deleteMeal(i){state.meals[selectedDate].splice(i,1);persist();render()}
function weight(){let logs=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date)),last=logs.at(-1),first=logs[0];return `${header('Body weight','PROGRESS TRACKER')}<div class="card hero"><div class="eyebrow">LATEST WEIGH-IN</div><h1>${last?last.value+' <span style="font-size:17px">'+state.unit+'</span>':'—'}</h1><div class="muted tiny">${last?'Recorded '+last.date:'No weight recorded yet'}</div>${first&&last&&logs.length>1?`<p>${(last.value-first.value)>0?'+':''}${(last.value-first.value).toFixed(1)} ${state.unit} since first entry</p>`:''}</div><div class="card"><h3>Add weigh-in</h3><div class="fieldrow"><input id="weightdate" class="field" type="date" value="${today()}"><input id="weightval" class="field" type="number" step="0.1" inputmode="decimal" placeholder="Weight (${state.unit})"></div><button class="btn full" onclick="addWeight()">+ Save weight</button></div>${logs.length>1?`<div class="card"><h3>Weight trend</h3>${chart(logs)}</div>`:''}<div class="card"><h3>History</h3>${logs.length?logs.slice().reverse().map(l=>`<div class="log"><span class="muted">${l.date}</span><span><b>${l.value} ${state.unit}</b><button class="del" onclick="removeWeight('${l.date}')">×</button></span></div>`).join(''):'<div class="empty">Your weight history will appear here.</div>'}</div><p class="note">For comparable readings, weigh yourself in the morning under similar conditions. Look at trends rather than day-to-day changes.</p>`}
function addWeight(){let d=document.getElementById('weightdate').value,v=Number(document.getElementById('weightval').value);if(!d||!(v>0))return alert('Enter a date and valid weight.');state.weights=state.weights.filter(x=>x.date!==d);state.weights.push({date:d,value:v});persist();render()}function removeWeight(d){state.weights=state.weights.filter(x=>x.date!==d);persist();render()}
function chart(logs){let w=320,h=150,p=16,vals=logs.map(x=>x.value),lo=Math.min(...vals)-1,hi=Math.max(...vals)+1,points=vals.map((v,i)=>`${p+i*(w-2*p)/Math.max(1,vals.length-1)},${h-p-(v-lo)/(hi-lo)*(h-2*p)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="0" y1="${h-p}" x2="${w}" y2="${h-p}" stroke="#374055"/><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#374055"/><polyline fill="none" stroke="#8d8fff" stroke-width="3" points="${points}"/>${points.split(' ').map(q=>{let [x,y]=q.split(',');return `<circle cx="${x}" cy="${y}" r="3.5" fill="#9b9dff"/>`}).join('')}</svg><div class="row tiny muted"><span>${logs[0].date}</span><span>${logs.at(-1).date}</span></div>`}
function stats(){let all=Object.values(state.workouts),sets=all.reduce((n,w)=>n+Object.values(w).filter(x=>x.done).length,0),sessions=all.filter(w=>Object.values(w).some(x=>x.done)).length,days=Object.keys(state.meals).length;return `${header('Your consistency','TRAINING INSIGHTS')}<div class="statgrid"><div class="stat"><strong>${sessions}</strong><span>Sessions</span></div><div class="stat"><strong>${sets}</strong><span>Sets done</span></div><div class="stat"><strong>${days}</strong><span>Nutrition days</span></div></div><div class="card"><h3>Weekly program</h3>${plan.map((p,i)=>`<div class="log"><span>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span><b>${p.name}</b></div>`).join('')}</div><div class="card"><h3>Your data</h3><p class="note">Saved locally in this browser on this device. Export a backup periodically. Clearing browser data, using private browsing, or opening the file in another browser can lose or separate your records.</p><div class="fieldrow"><button class="btn secondary" onclick="backup()">Export backup</button><button class="btn secondary" onclick="document.getElementById('importfile').click()">Import backup</button></div><input id="importfile" type="file" accept="application/json" style="display:none" onchange="restore(this)"></div>`}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gymos-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function restore(input){let f=input.files[0];if(!f)return;f.text().then(t=>{try{let v=JSON.parse(t);if(!v||typeof v!=='object'||!v.workouts||!v.meals||!Array.isArray(v.weights))throw Error('Invalid backup');if(!confirm('Replace your current tracker data with this backup?'))return;state=v;persist();render()}catch(e){alert('Could not import backup: '+e.message)}})}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)}));render();
</script></body></html>
