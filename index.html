<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c12"><title>GymOS — Train smarter</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#090c12;color:#f4f5f8}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}main{max-width:590px;margin:auto;padding:25px 18px 118px}.muted{color:#8992a4}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:#a6b3ca}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{font-size:23px;font-weight:900;letter-spacing:-1.4px}.brand span{color:#a3f65c}.avatar{border-radius:50%;height:38px;width:38px;display:grid;place-items:center;background:#252c38;color:#b9c5d8;font-weight:800}.greeting{font-size:13px;color:#a4afc0;margin-bottom:7px}.headline{font-size:33px;letter-spacing:-1.4px;line-height:1.1;margin:0 0 21px}.card{background:#151a23;border:1px solid #252c38;border-radius:21px;padding:18px;margin:13px 0}.hero{background:linear-gradient(135deg,#273625,#19241f 55%,#151a23);border-color:#40523b;padding:22px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero h2{font-size:30px;letter-spacing:-1px;margin:8px 0}.sub{font-size:13px;color:#a4afc0}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:7px 10px;background:#2d3b2d;color:#c4f6a1;font-size:11px;font-weight:800}.btn{border:0;border-radius:13px;padding:13px 17px;background:#a3f65c;color:#15220f;font-weight:850}.btn.secondary{background:#252c39;color:#edf2f7}.btn.ghost{background:transparent;border:1px solid #394354;color:#d9e2ed}.btn.small{padding:9px 12px;font-size:12px}.full{width:100%}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin:18px 0}.day{padding:12px 0;border:1px solid #303847;background:#171e28;color:#9ca9ba;border-radius:13px;font-size:12px;font-weight:800}.day.active{background:#a3f65c;color:#14210c;border-color:#a3f65c}.progress{height:7px;border-radius:10px;background:#354034;overflow:hidden;margin:17px 0 9px}.progress>div{height:100%;background:#a3f65c}.section{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.section h2{font-size:20px;letter-spacing:-.5px;margin:0}.exercise{padding:16px 15px}.ex-title{font-weight:850;font-size:16px;letter-spacing:-.3px}.ex-meta{font-size:12px;color:#8995a7;margin-top:5px}.sethead,.setrow{display:grid;grid-template-columns:29px 1fr 1fr 42px;align-items:center;gap:9px}.sethead{color:#7f8b9b;text-align:center;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-top:19px;margin-bottom:7px}.setrow{margin:8px 0}.setnum{font-size:12px;font-weight:800;color:#9da7b7;text-align:center}.setrow input{width:100%;min-width:0;background:#0d121a;border:1px solid #313c4a;color:#f5f8fc;border-radius:11px;padding:12px 5px;text-align:center;font-size:16px;font-weight:700}.setrow input:focus{outline:2px solid #a3f65c}.check{height:43px;border:1px solid #4b5664;border-radius:11px;background:#232b36;color:#aab6c5;font-size:18px}.check.done{background:#a3f65c;color:#15220e;border-color:#a3f65c}.prev{font-size:11px;color:#8290a3;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#191f29;border:1px solid #2c3541;border-radius:16px;padding:15px 9px}.metric strong{display:block;font-size:23px;letter-spacing:-1px}.metric span{font-size:11px;color:#98a4b6}.field{width:100%;min-width:0;padding:13px;background:#0c1119;border:1px solid #354051;border-radius:12px;color:#f4f7fb}.fieldrow{display:flex;gap:9px;margin:13px 0}.fieldrow>*{flex:1;min-width:0}.log{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #2b3440;padding:14px 0}.log:last-child{border-bottom:0}.del{background:transparent;border:0;color:#9ba6b8;font-size:20px}.bar{height:10px;background:#303946;border-radius:20px;overflow:hidden;margin:17px 0}.bar>div{height:100%;background:#a3f65c}.note{font-size:12px;line-height:1.65;color:#8c98a9}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#111721ee;backdrop-filter:blur(15px);border-top:1px solid #303847;padding:8px 9px calc(8px + env(safe-area-inset-bottom));z-index:10}.navinner{display:grid;grid-template-columns:repeat(4,1fr);width:min(590px,100%)}.nav button{border:0;background:none;color:#8390a3;padding:8px 0;font-size:11px;font-weight:700}.nav button b{display:block;font-size:22px;margin-bottom:5px}.nav button.active{color:#a3f65c}.chart{width:100%;height:170px}.empty{text-align:center;padding:27px 12px;color:#8996a8}.datebar{display:flex;justify-content:space-between;align-items:center;margin-top:17px}.datebar input{max-width:170px}input[type=date]{color-scheme:dark}.history{font-size:11px;color:#9dabbd;margin-top:8px}.badge{background:#27303e;color:#b7c4d8;border-radius:9px;padding:6px 9px;font-size:11px;font-weight:800}
</style></head><body><main><header class="top"><div class="brand">GYM<span>OS</span><span style="font-size:9px;vertical-align:top;margin-left:5px;letter-spacing:1px;color:#8996a7">2.0</span></div><div class="avatar">G</div></header><section id="view"></section></main><nav class="nav"><div class="navinner"><button data-tab="train" class="active"><b>◉</b>Train</button><button data-tab="protein"><b>◈</b>Fuel</button><button data-tab="weight"><b>↗</b>Body</button><button data-tab="stats"><b>▥</b>Insights</button></div></nav><script>
const plan=[{name:'Push A',focus:'Chest · Shoulders · Triceps',ex:[['Dumbbell bench press',3,9],['Chest press',3,9],['Shoulder press',3,9],['Incline-bench lateral raises',3,9],['Rope triceps pushdown',3,9],['Overhead rope extension',3,9]]},{name:'Pull A',focus:'Back · Biceps · Forearms',ex:[['Wide-grip lat pulldown',3,9],['Low row',3,9],['Rear delt machine',3,9],['Incline dumbbell curls',3,9],['Reverse curls',3,11],['Wrist flexions',3,8]]},{name:'Legs A',focus:'Quads · Calves',ex:[['Leg extension',3,9],['Goblet squat',3,12],['Leg press',3,9],['Prone leg curl',3,9],['Calf extension',4,'Failure']]},{name:'Push B',focus:'Chest · Shoulders · Triceps',ex:[['High-to-low cable fly',3,9],['Low-to-high cable fly',3,9],['Pec fly machine',3,9],['Incline-bench lateral raises',3,9],['Dips',3,9],['Triceps extension',3,9]]},{name:'Pull B',focus:'Back · Biceps · Forearms',ex:[['Seated row',3,9],['Lat pulldown',3,9],['Back extension',3,9],['Cable straight-bar curls',3,9],['Preacher curls',3,9],['Wrist extensions',3,8]]},{name:'Legs B',focus:'Hamstrings · Glutes · Calves',ex:[['Romanian deadlift',3,9],['Prone leg curl',3,9],['Leg press',3,9],['Hip adductor',3,9],['Calf extension',4,'Failure']]},{name:'Rest',focus:'Recovery · Mobility',ex:[]}];
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let state;try{state=JSON.parse(localStorage.getItem('gymos-v1'))||{}}catch{state={}}state.workouts??={};state.meals??={};state.weights??=[];state.goal??=160;state.unit??='lb';const bundledWorkoutHistory={"2026-10-19-0":{"0-0":{"kg":"23","done":true},"0-1":{"kg":"25","done":true},"0-2":{"kg":"30","done":true},"1-0":{"kg":"36","done":true},"1-1":{"kg":"36","done":true},"1-2":{"kg":"45","done":true},"2-0":{"kg":"27","done":true},"2-1":{"kg":"32","done":true},"2-2":{"kg":"27","done":true},"3-0":{"kg":"15","done":true},"3-1":{"kg":"15","done":true},"3-2":{"kg":"15","done":true},"4-0":{"kg":"35","done":true},"4-1":{"kg":"40","done":true},"4-2":{"kg":"40","done":true},"5-0":{"kg":"30","done":true},"5-1":{"kg":"35","done":true}},"2026-10-20-1":{"0-0":{"kg":"85","done":true},"0-1":{"kg":"100","done":true},"0-2":{"kg":"100","done":true},"1-0":{"kg":"85","done":true},"1-1":{"kg":"100","done":true},"1-2":{"kg":"100","done":true},"2-0":{"kg":"80","done":true},"2-1":{"kg":"80","done":true},"2-2":{"kg":"90"},"3-0":{"kg":"20","done":true},"3-1":{"kg":"25","done":true},"3-2":{"kg":"25","done":true},"4-0":{"kg":"20"},"4-1":{"kg":"25"},"5-0":{"kg":"25"},"5-1":{"kg":"30"}},"2026-10-21-2":{"0-0":{"kg":"80","done":true},"0-1":{"kg":"90","done":true},"0-2":{"kg":"110","done":true},"1-0":{"kg":"25","done":true},"1-1":{"kg":"30","done":true},"1-2":{"kg":"40","done":true},"2-0":{"kg":"180","done":true},"2-1":{"kg":"180","done":true},"2-2":{"kg":"230","done":true},"3-0":{"kg":"80","done":true},"3-1":{"kg":"100","done":true},"3-2":{"kg":"110","done":true},"4-0":{"kg":"120","done":true},"4-1":{"kg":"120","done":true},"4-2":{"done":true,"kg":"120"},"4-3":{"done":true,"kg":"120"}},"2026-10-22-3":{"0-0":{"kg":"28","done":true},"0-1":{"kg":"28","done":true},"0-2":{"kg":"28","done":true},"1-0":{"kg":"18","done":true},"1-1":{"kg":"18","done":true},"1-2":{"kg":"22","done":true},"2-0":{"kg":"100","done":true},"2-1":{"kg":"115","done":true},"2-2":{"kg":"130","done":true},"3-0":{"kg":"15","done":true},"3-1":{"kg":"15","done":true},"3-2":{"kg":"18","done":true}}};for(const [date,sets] of Object.entries(bundledWorkoutHistory)){state.workouts[date]??={};for(const [key,entry] of Object.entries(sets)){state.workouts[date][key]??={};for(const [field,value] of Object.entries(entry)){if(state.workouts[date][key][field]===undefined||state.workouts[date][key][field]==='')state.workouts[date][key][field]=value}}}localStorage.setItem('gymos-v1',JSON.stringify(state));let tab='train',day=(new Date().getDay()+6)%7,selectedDate=today();function persist(){localStorage.setItem('gymos-v1',JSON.stringify(state))}function wk(){return selectedDate+'-'+day}function entries(){return state.workouts[wk()]||{}}function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}function totalProtein(d){return(state.meals[d]||[]).reduce((a,m)=>a+Number(m.g||0),0)}function head(eyebrow,title){return `<div class="eyebrow">${eyebrow}</div><h1 class="headline">${title}</h1>`}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('view').innerHTML=tab==='train'?train():tab==='protein'?protein():tab==='weight'?weight():stats()}
function previous(i,j){let dates=Object.keys(state.workouts).filter(k=>k.endsWith('-'+day)&&k.slice(0,10)<selectedDate).sort().reverse();for(let d of dates){let v=state.workouts[d]?.[i+'-'+j];if(v&&(v.kg!==undefined||v.reps!==undefined))return [v.kg||'—',v.reps||'—',d.slice(0,10)]}return null}
function train(){let p=plan[day],w=entries(),total=p.ex.reduce((a,e)=>a+e[1],0),done=p.ex.reduce((n,e,i)=>n+Array.from({length:e[1]},(_,j)=>w[i+'-'+j]?.done?1:0).reduce((a,b)=>a+b,0),0);return `<div class="greeting">Your training, simplified.</div><h1 class="headline">Let's get stronger.</h1><div class="days">${['M','T','W','T','F','S','S'].map((x,i)=>`<button class="day ${day===i?'active':''}" onclick="day=${i};render()" aria-label="${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]}">${x}</button>`).join('')}</div><div class="card hero"><div class="row"><span class="pill">● ${day===6?'RECOVERY DAY':'YOUR SESSION'}</span><span class="sub">${['MON','TUE','WED','THU','FRI','SAT','SUN'][day]}</span></div><h2>${p.name}</h2><div class="sub">${p.focus}</div>${total?`<div class="progress"><div style="width:${pct(done,total)}%"></div></div><div class="row sub"><span>${done} of ${total} sets complete</span><strong style="color:#d0f5b1">${pct(done,total)}%</strong></div>`:'<p class="note">Recover, move, and get ready for your next session.</p>'}</div><div class="datebar"><span class="sub">Log workout for</span><input class="field" type="date" value="${selectedDate}" onchange="selectedDate=this.value;render()"></div>${p.ex.length?`<div class="section"><h2>Exercises</h2><span class="badge">${p.ex.length} movements</span></div>`:''}${p.ex.map((e,i)=>`<article class="card exercise"><div class="row"><div><div class="ex-title">${safe(e[0])}</div><div class="ex-meta">${e[1]} sets · ${e[2]==='Failure'?'To failure':e[2]+' target reps'}</div></div><span class="badge">${i+1}/${p.ex.length}</span></div><div class="sethead"><span>Set</span><span>Weight (${safe(state.unit)})</span><span>Reps</span><span>✓</span></div>${Array.from({length:e[1]},(_,j)=>{let id=i+'-'+j,v=w[id]||{},pr=previous(i,j);return `<div class="setrow"><span class="setnum">${j+1}</span><input aria-label="Weight for ${safe(e[0])} set ${j+1}" type="number" inputmode="decimal" placeholder="—" value="${safe(v.kg??'')}" onchange="updateSet(${i},${j},'kg',this.value)"><input aria-label="Reps for ${safe(e[0])} set ${j+1}" type="number" inputmode="numeric" placeholder="${e[2]==='Failure'?'Max':e[2]}" value="${safe(v.reps??'')}" onchange="updateSet(${i},${j},'reps',this.value)"><button class="check ${v.done?'done':''}" aria-label="Toggle set ${j+1} completion" onclick="updateSet(${i},${j},'done',${!v.done})">${v.done?'✓':'○'}</button></div>${pr?`<div class="history">Last: ${safe(pr[0])} ${safe(state.unit)} × ${safe(pr[1])} reps · ${safe(pr[2])}</div>`:''}`}).join('')}</article>`).join('')}<p class="note">Your entries save automatically on this device. Aim for controlled reps and steady progression.</p>`}
function updateSet(i,j,key,value){state.workouts[wk()]??={};state.workouts[wk()][i+'-'+j]??={};state.workouts[wk()][i+'-'+j][key]=value;persist();if(key==='done')render()}
function protein(){let meals=state.meals[selectedDate]||[],total=totalProtein(selectedDate);return `${head('NUTRITION','Fuel your gains.')}<div class="card hero"><div class="eyebrow">DAILY PROTEIN</div><h2 style="font-size:43px;margin:13px 0">${total}<span class="sub"> / ${state.goal} g</span></h2><div class="bar"><div style="width:${pct(total,state.goal)}%"></div></div><div class="row sub"><span>${pct(total,state.goal)}% of target</span><span>${Math.max(0,state.goal-total)} g remaining</span></div></div><div class="card"><div class="row"><b>Daily target</b><input class="field" style="max-width:95px" type="number" min="1" value="${state.goal}" onchange="state.goal=Math.max(1,Number(this.value)||160);persist();render()"></div><div class="datebar"><span class="sub">Entry date</span><input class="field" type="date" value="${selectedDate}" onchange="selectedDate=this.value;render()"></div></div><div class="section"><h2>Log protein</h2></div><div class="card"><div class="fieldrow"><input id="mealname" class="field" placeholder="Food or meal"><input id="mealgrams" class="field" style="max-width:110px" type="number" inputmode="numeric" placeholder="Grams"></div><button class="btn full" onclick="addMeal()">+ Add food</button><div class="fieldrow"><button class="btn secondary" onclick="quickMeal('Protein shake',40)">+ Shake · 40g</button><button class="btn secondary" onclick="quickMeal('Protein-rich meal',40)">+ Meal · 40g</button></div></div><div class="section"><h2>Today's entries</h2><span class="badge">${meals.length}</span></div><div class="card">${meals.length?meals.map((m,i)=>`<div class="log"><span>${safe(m.name)}${m.estimated?' <small class="muted">· estimate</small>':''}</span><span><b>${Number(m.g)}g</b><button class="del" aria-label="Delete entry" onclick="deleteMeal(${i})">×</button></span></div>`).join(''):'<div class="empty">No protein logged for this date.</div>'}</div>`}
function quickMeal(name,g){state.meals[selectedDate]??=[];state.meals[selectedDate].push({name,g});persist();render()}function addMeal(){let n=document.getElementById('mealname').value.trim(),g=Number(document.getElementById('mealgrams').value);if(!n||!(g>0))return alert('Enter a food and its protein amount.');quickMeal(n,g)}function deleteMeal(i){state.meals[selectedDate].splice(i,1);persist();render()}
function weight(){let logs=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date)),last=logs.at(-1),first=logs[0];return `${head('BODY METRICS','Track the trend.')}<div class="card hero"><div class="eyebrow">LATEST WEIGH-IN</div><h2 style="font-size:43px;margin:12px 0">${last?safe(last.value)+' <span class="sub">'+safe(state.unit)+'</span>':'—'}</h2><div class="sub">${last?'Recorded '+safe(last.date):'No weigh-ins yet'}</div>${first&&last&&logs.length>1?`<p class="sub">${(last.value-first.value)>0?'+':''}${(last.value-first.value).toFixed(1)} ${safe(state.unit)} since first entry</p>`:''}</div><div class="card"><h3>New weigh-in</h3><div class="fieldrow"><input id="weightdate" class="field" type="date" value="${today()}"><input id="weightval" class="field" type="number" step="0.1" inputmode="decimal" placeholder="Weight (${safe(state.unit)})"></div><button class="btn full" onclick="addWeight()">Save weight</button></div>${logs.length>1?`<div class="card"><h3>Weight trend</h3>${chart(logs)}</div>`:''}<div class="section"><h2>History</h2></div><div class="card">${logs.length?logs.slice().reverse().map(l=>`<div class="log"><span class="muted">${safe(l.date)}</span><span><b>${safe(l.value)} ${safe(state.unit)}</b><button class="del" aria-label="Remove weigh-in" onclick="removeWeight('${safe(l.date)}')">×</button></span></div>`).join(''):'<div class="empty">Your weight history will appear here.</div>'}</div>`}
function addWeight(){let d=document.getElementById('weightdate').value,v=Number(document.getElementById('weightval').value);if(!d||!(v>0))return alert('Enter a valid weight and date.');if(state.weights.some(x=>x.date===d)&&!confirm('Replace the weigh-in already recorded on this date?'))return;state.weights=state.weights.filter(x=>x.date!==d);state.weights.push({date:d,value:v});persist();render()}function removeWeight(d){if(!confirm('Delete this weigh-in?'))return;state.weights=state.weights.filter(x=>x.date!==d);persist();render()}
function chart(logs){let w=320,h=150,p=16,vals=logs.map(x=>Number(x.value)),lo=Math.min(...vals)-1,hi=Math.max(...vals)+1,points=vals.map((v,i)=>`${p+i*(w-2*p)/Math.max(1,vals.length-1)},${h-p-(v-lo)/(hi-lo)*(h-2*p)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="#a3f65c" stroke-width="3" points="${points}"/>${points.split(' ').map(q=>{let [x,y]=q.split(',');return `<circle cx="${x}" cy="${y}" r="3.5" fill="#a3f65c"/>`}).join('')}</svg><div class="row sub"><span>${safe(logs[0].date)}</span><span>${safe(logs.at(-1).date)}</span></div>`}
function stats(){let all=Object.values(state.workouts),sets=all.reduce((n,w)=>n+Object.values(w).filter(x=>x.done).length,0),sessions=all.filter(w=>Object.values(w).some(x=>x.done)).length,days=Object.keys(state.meals).filter(d=>(state.meals[d]||[]).length).length;let records=[];for(let [date,w] of Object.entries(state.workouts)){let index=Number(date.slice(-1)),p=plan[index];if(!p)continue;for(let [k,v] of Object.entries(w)){let ex=p.ex[Number(k.split('-')[0])];if(!ex||!v.done)continue;let weight=Number(v.kg),reps=Number(v.reps);if(weight>0&&reps>0){let name=ex[0],old=records.find(x=>x.name===name);if(!old||weight>old.weight){if(old)records.splice(records.indexOf(old),1);records.push({name,weight,reps})}}}}records.sort((a,b)=>a.name.localeCompare(b.name));return `${head('TRAINING ANALYTICS','Every rep counts.')}<div class="grid"><div class="metric"><strong>${sessions}</strong><span>Sessions</span></div><div class="metric"><strong>${sets}</strong><span>Sets done</span></div><div class="metric"><strong>${days}</strong><span>Fuel days</span></div></div><div class="section"><h2>Best logged lifts</h2></div><div class="card">${records.length?records.map(x=>`<div class="log"><span>${safe(x.name)}</span><b>${x.weight} ${safe(state.unit)} × ${x.reps}</b></div>`).join(''):'<div class="empty">Complete weighted sets to see your best lifts.</div>'}</div><div class="section"><h2>Your weekly split</h2></div><div class="card">${plan.map((p,i)=>`<div class="log"><span class="muted">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span><b>${p.name}</b></div>`).join('')}</div><div class="section"><h2>Data & backups</h2></div><div class="card"><p class="note">Your history stays in this browser under the original GymOS storage key. Export a backup before switching devices or clearing browser data. Import merges records and never replaces an existing workout set automatically.</p><div class="fieldrow"><button class="btn secondary" onclick="backup()">Export backup</button><button class="btn secondary" onclick="document.getElementById('importfile').click()">Import & merge</button></div><input id="importfile" type="file" accept="application/json" style="display:none" onchange="restore(this)"></div>`}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gymos-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function restore(input){let f=input.files[0];if(!f)return;f.text().then(t=>{try{let v=JSON.parse(t);if(!v||typeof v!=='object'||!v.workouts||!v.meals||!Array.isArray(v.weights))throw Error('Invalid backup');if(!confirm('Merge this backup into your existing history? Current records will be kept when there is a conflict.'))return;let next=JSON.parse(JSON.stringify(state));for(let [date,sets] of Object.entries(v.workouts)){next.workouts[date]??={};for(let [key,entry] of Object.entries(sets||{})){next.workouts[date][key]??={};for(let [field,val] of Object.entries(entry||{}))if(next.workouts[date][key][field]===undefined||next.workouts[date][key][field]==='')next.workouts[date][key][field]=val}}for(let [date,meals] of Object.entries(v.meals))if(Array.isArray(meals)){next.meals[date]??=[];for(let m of meals)if(!next.meals[date].some(x=>JSON.stringify(x)===JSON.stringify(m)))next.meals[date].push(m)}for(let w of v.weights)if(w&&w.date&&!next.weights.some(x=>x.date===w.date))next.weights.push(w);state=next;persist();render();alert('Backup merged. Existing records were preserved.')}catch(e){alert('Import failed: '+e.message)}finally{input.value=''}})}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)}));render();
</script></body></html>
